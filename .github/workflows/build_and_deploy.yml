name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: my-api-image
  REGISTRY: docker.io/masaftic

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Log in to Docker
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login $REGISTRY -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build -t $REGISTRY/$IMAGE_NAME:latest -f src/BenhaScooters/Dockerfile .

      - name: Tag image for Docker Hub
        run: |
          docker tag $IMAGE_NAME:latest docker.io/${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:latest
      
      - name: Push Docker image
        run: |
          docker push $REGISTRY/$IMAGE_NAME:latest

      - name: SSH and deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker login $REGISTRY -u "${{ secrets.DOCKER_USERNAME }}" --password "${{ secrets.DOCKER_PASSWORD }}"
            docker pull $REGISTRY/$IMAGE_NAME:latest
            cd /home/${{ secrets.EC2_USER }}/app
            docker compose down
            docker compose up -d
