name: Tests

on:
  push:
    branches:
      - main
      - develop

  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Benha-Scooters.slnx

      - name: Build
        run: dotnet build Benha-Scooters.slnx --no-restore

      - name: Run tests
        run: dotnet test Benha-Scooters.slnx --no-build --verbosity normal
