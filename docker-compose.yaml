# postgres and minio

version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: src/BenhaScooters/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: "Host=${DB_HOST};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__SigningKey: "${JWT_SIGNING_KEY}"
      Jwt__AccessTokenLifetimeMinutes: ${JWT_ACCESS_TOKEN_LIFETIME_MINUTES}
      Jwt__RefreshTokenLifetimeDays: ${JWT_REFRESH_TOKEN_LIFETIME_DAYS}
      S3__BucketName: "${S3_BUCKET_NAME}"
      S3__Region: "${S3_REGION}"
      S3__AccessKey: "${S3_ACCESS_KEY}"
      S3__SecretKey: "${S3_SECRET_KEY}"
      S3__ServiceUrl: "${S3_SERVICE_URL}" 
      TokenCleanup__IntervalHours: ${TOKEN_CLEANUP_INTERVAL_HOURS}
    ports:
      - "${API_PORT}:5000"
    depends_on:
      - postgres
      # - minio
    restart: unless-stopped

  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data: