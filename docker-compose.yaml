# postgres

version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: benha_scooters
      POSTGRES_USER: user123
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart:
      unless-stopped

volumes:
  postgres_data: