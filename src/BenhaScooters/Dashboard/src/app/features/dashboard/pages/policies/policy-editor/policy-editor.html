<!-- policy-editor.component.html -->
<div class="max-w-5xl mx-auto">
  <!-- go back button -->
  <button pButton type="button" icon="pi pi-arrow-left" class="p-button-text mb-2" (click)="goBack()">
    Back to Policies
  </button>

  <div class="flex items-center justify-between mb-4">
    <h1 class="text-2xl font-semibold">
      {{ policyTitle }}
      @if (lastUpdated()) {
        <div class="text-sm text-gray-500">
          Last updated
          {{ getDaysAgoMessage(lastUpdated()) }}
          ({{ lastUpdated() | date: "d MMM y, h:mm a" }})
        </div>
      }
    </h1>

    <button pButton label="Save" icon="pi pi-save" [disabled]="loading()" [loading]="loading()" (click)="savePolicy()"></button>
  </div>


  @if (loading()) {
  <div class="text-gray-500">Loading...</div>
  }

  @if (!loading() && error()) {
  <div class="text-red-500">Error loading policy content. Please try again.</div>
  }

  @if (!loading() && !error()) {
  <div class="bg-white border rounded-lg shadow-sm">
    <p-editor [(ngModel)]="policyContent" [style]="{ height: '550px' }" placeholder="Enter HTML content here...">
    </p-editor>
  </div>
  }
</div>

<p-toast></p-toast>
