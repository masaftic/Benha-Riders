<div class="p-4">
  <div class="flex justify-between items-center mb-4">
    <h1 class="font-bold text-2xl">Tags Management</h1>
    <p-button
      label="Add Tag"
      icon="pi pi-plus"
      (onClick)="openCreateDialog()"
    />
  </div>

  <div class="mb-4">
    <input
      pInputText
      type="text"
      placeholder="Search tags..."
      (input)="onGlobalFilter($event)"
    />
  </div>

  <div class="card">
    <p-table
      [value]="filteredTags()"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[5, 10, 20, 50]"
      [showCurrentPageReport]="true"
      stripedRows
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} tags"
    >
      <ng-template #header>
        <tr>
          <th style="width: 20%">
            <div class="flex items-center">#</div>
          </th>
          <th pSortableColumn="name" style="width: 40%">
            <div class="flex items-center gap-2">
              Name
              <p-sortIcon field="name"></p-sortIcon>
            </div>
          </th>
          <th pSortableColumn="videoCount" style="width: 20%">
            <div class="flex items-center gap-2">
              Videos
              <p-sortIcon field="videoCount"></p-sortIcon>
            </div>
          </th>
          <th style="width: 20%">
            <div class="flex items-center">Actions</div>
          </th>
        </tr>
      </ng-template>
      <ng-template #body let-tag let-rowIndex="rowIndex">
        <tr>
          <td>{{ rowIndex + 1 }}</td>
          <td>{{ tag.name }}</td>
          <td>{{ tag.videoCount }}</td>
          <td>
            <div class="flex gap-2">
              <p-button
                icon="pi pi-pencil"
                [rounded]="true"
                [text]="true"
                severity="info"
                (onClick)="openEditDialog(tag)"
                pTooltip="Edit"
              />
              <p-button
                icon="pi pi-trash"
                [rounded]="true"
                [text]="true"
                severity="danger"
                (onClick)="confirmDelete(tag)"
                pTooltip="Delete"
              />
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="4" class="py-4 text-center">No tags found</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Create/Edit Dialog -->
<p-dialog
  [header]="isEditMode() ? 'Edit Tag' : 'Create Tag'"
  [(visible)]="showDialog"
  [modal]="true"
  [style]="{ width: '450px' }"
  [draggable]="false"
  [resizable]="false"
  [focusOnShow]="false"
  >
  <form [formGroup]="tagForm" (ngSubmit)="saveTag()" >
    <div class="flex flex-col gap-4">
      <div class="flex flex-col gap-2">
        <label for="name" class="font-semibold">Name</label>
        <input
          pInputText
          id="name"
          formControlName="name"
          placeholder="Enter tag name"
          class="w-full"
        />
        @if (tagForm.get('name')?.invalid && tagForm.get('name')?.touched) {
          <small class="text-red-500">Name is required and must be between 2 and 50 characters</small>
        }
      </div>
    </div>
  </form>

  <ng-template #footer>
    <p-button
      label="Cancel"
      [text]="true"
      severity="secondary"
      (onClick)="closeDialog()"
    />
    <p-button
      label="Save"
      [disabled]="tagForm.invalid"
      (onClick)="saveTag()"
    />
  </ng-template>
</p-dialog>

<!-- Toast & Confirm Dialog -->
<p-toast />
<p-confirmDialog />
