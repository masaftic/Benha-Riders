<div class="p-4">
  <div class="flex justify-between items-center mb-4">
    <h1 class="font-bold text-2xl">Parents Management</h1>
  </div>

  <div class="mb-4">
    <input
      pInputText
      type="text"
      placeholder="Search parents..."
      (input)="onGlobalFilter($event)"
      class="w-full"
    />
  </div>

  <div class="card">
    <p-table
      [value]="parents()"
      [lazy]="true"
      [paginator]="true"
      [rows]="pageSize()"
      [totalRecords]="totalRecords()"
      [rowsPerPageOptions]="[5, 10, 20, 50]"
      [showCurrentPageReport]="true"
      [loading]="loading()"
      [first]="(pageNumber() - 1) * pageSize()"
      [rows]="pageSize()"
      (onLazyLoad)="onPageChange($event)"
      (onSort)="onSort($event)"
      stripedRows
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} parents"
    >
      <ng-template #header>
        <tr>
          <th style="width: 5%">
            <div class="flex items-center">#</div>
          </th>
          <th style="width: 30%">
            <div class="flex items-center gap-2">
              Full Name
            </div>
          </th>
          <th style="width: 30%">
            <div class="flex items-center gap-2">
              Email
            </div>
          </th>
          <th pSortableColumn="kids" style="width: 15%">
            <div class="flex items-center gap-2">
              Kids
              <p-sortIcon field="kids"></p-sortIcon>
            </div>
          </th>
          <th pSortableColumn="joinedAt" style="width: 15%">
            <div class="flex items-center gap-2">
              Joined
              <p-sortIcon field="joinedAt"></p-sortIcon>
            </div>
          </th>
          <th style="width: 5%">
            <div class="flex items-center">Actions</div>
          </th>
        </tr>
      </ng-template>
      <ng-template #body let-parent let-rowIndex="rowIndex">
        <tr>
          <td>{{ (pageNumber() - 1) * pageSize() + rowIndex + 1 }}</td>
          <td>{{ parent.fullName }}</td>
          <td>{{ parent.email }}</td>
          <td>{{ parent.numberOfKids }}</td>
          <td>{{ parent.createdAt | date: 'MMM d, y' }}</td>
          <td>
            <div class="flex gap-2">
              <p-button
                icon="pi pi-eye"
                [rounded]="true"
                [text]="true"
                severity="info"
                (onClick)="viewDetails(parent)"
                pTooltip="View Details"
              />
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="6" class="py-4 text-center!">No parents found</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-toast />
