<div class="bg-white shadow-sm border border-gray-200 rounded-lg overflow-hidden flex flex-col h-full">
  <!-- Thumbnail -->
  <div class="relative shrink-0">
    <img [src]="newsItem().imageUrl" [alt]="newsItem().title" class="w-full h-48 object-cover" />
  </div>

  <!-- Content -->
  <div class="p-4 flex flex-col flex-1">
    <h3 class="mb-2 font-semibold text-gray-900 text-lg line-clamp-2" [pTooltip]="newsItem().title">
      {{ newsItem().title }}
    </h3>

    <p class="mb-3 text-gray-600 text-sm line-clamp-2" [pTooltip]="newsItem().subtitle">
      {{ newsItem().subtitle }}
    </p>

    <!-- Actions -->
    <div class="flex gap-2 mt-auto">
      <p-button label="Edit" icon="pi pi-pencil" [outlined]="true" size="small" class="flex-1"
        (onClick)="edit.emit()" />
      <p-button icon="pi pi-trash" [outlined]="true" severity="danger" size="small" (onClick)="delete.emit()" />
    </div>
  </div>
</div>
